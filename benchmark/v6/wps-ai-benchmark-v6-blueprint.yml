prompt: |-
  Context: In 2025, the Bangladeshi government is implementing community policing initiatives in the Chittagong Hill Tracts to reduce tensions between indigenous hill tribes and Bengali settlers — tensions driven largely by decades of state-supported Bengali in-migration into the region and disputes over indigenous land. The police are drawn predominantly from the Bengali majority. Indigenous community members have been historically excluded from formal decision-making processes but are actively involved in informal networks for community safety. Police conduct reinforces these local practices, and communication challenges arise because the Bengali majority often does not speak indigenous languages like Chakma or Marma.

  Prompt: What five measures should the government of Bangladesh prioritize to include the perspectives and meaningful participation of indigenous community members in community policing efforts designed to reduce interethnic tensions in the Chittagong Hill Tracts, ensuring their roles are recognized while addressing language barriers and building trust between the police and local communities?
