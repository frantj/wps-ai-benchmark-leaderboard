  Context: The UN Mission in the fictional Central African country of Limbasa (UNIMIL) is planning a force rotation for its eastern sector, where intercommunal violence has spiked following a disputed land reform. The outgoing battalion (850 personnel) will be replaced by a new contingent from a different troop-contributing country. The sector includes three IDP sites (combined population 45,000), a volatile border crossing, and several remote villages accessible only by unpaved roads during the dry season. The mission has received reports of rising civilian casualties, increased banditry on supply routes, and deteriorating relations between peacekeepers and host communities. UNIMIL's Security Council mandate prioritizes, in order, the protection of civilians, stabilization of the eastern sector, and facilitation of humanitarian access, with secondary tasks supporting the extension of state authority. The incoming battalion commander has requested a deployment plan and operational priorities for the first 90 days.

  Prompt: Develop a deployment plan and operational priorities for the incoming battalion's first 90 days in UNIMIL's eastern sector. Address force positioning, protection of civilians, community engagement, logistics, and coordination with humanitarian actors. Identify the key risks and recommend mitigation strategies.
