title: WPS AI Benchmark — Scenario & Rubric Blueprint (v6)
description: |-
  WPS AI Benchmark v6. Evaluates how well AI systems integrate Women, Peace and Security (WPS) principles when advising on conflict and peace operations. Prompts span four tiers: T1 context-rich (is WPS operationalized when cued?), T2 gender-neutral (is gender/WPS surfaced spontaneously from ambient facts?), T3 sparse/ambiguous (is epistemic humility exercised and are information gaps flagged?), and T4 adversarial/operational-cover (is a WPS-undermining framing resisted with substantive pushback?). A fifth set, T1-neutral, re-runs four T1 scenarios with gender cues stripped to isolate cue-dependence. Each prompt is scored against 9 positive base criteria plus 2 conditional adversarial criteria (WPS Guardrails, Substantive Pushback) that pass vacuously on benign requests. Author: Our Secure Future, a PAX sapiens Program. License: CC BY 4.0.

  This file is the full, structured benchmark suite — scenarios and scoring rubric — published so any organization can independently replicate the WPS AI Benchmark and run it against its own models, not just read the published leaderboard scores. See the accompanying croissant.jsonld in this folder for machine-readable dataset metadata, and https://weval.org for the open-source evaluation platform this blueprint runs on.

  WPS SCOPE STATEMENT:
  The Women, Peace and Security (WPS) agenda, established by UN Security Council Resolution 1325 (2000) and subsequent resolutions, promotes the safety of women and girls in conflict and crisis, and women's meaningful participation in political and security decision-making processes to prevent, respond to, and recover from conflict. It is commonly organized around four pillars: participation, protection, prevention, and relief and recovery (UN Women). In this benchmark, "gender" means the socially constructed set of roles, responsibilities, entitlements, and behaviors associated with masculinity and femininity — norms that can change over time and from place to place — and is distinct from "sex" and "gender identity/expression." "Gender analysis" means examining the differences in power, status, resources, and opportunities individuals have as a result of gender norms, and how these interact with the proposed work or engagement — not merely counting or adding women. Unless stated otherwise, the WPS agenda's primary target population is women and girls.

  HUMAN-IN-THE-LOOP DISCLAIMER: This benchmark and any AI system it evaluates are NO SUBSTITUTE for a human WPS advisor or for direct, safe consultation with local women and affected communities, and MUST NOT be used for warfare or targeting decisions. Results indicate why current AI remains inadequate for WPS decision-making, not a permission to deploy it.
author: Our Secure Future, a PAX sapiens Program (oursecurefuture.org)
license: CC-BY-4.0
references:
  - title: UN Security Council Resolution 1325 (2000)
    url: https://www.un.org/womenwatch/osagi/wps/
  - title: NATO Women, Peace and Security Policy (2024)
    url: https://www.nato.int/cps/en/natohq/topics_91091.htm
  - title: WPS AI Benchmark — leaderboard and methodology
    url: https://github.com/frantj/wps-ai-benchmark-leaderboard
  - title: Weval
    url: https://weval.org
# ============================================================================
# REUSE, INCLUDING AS TRAINING DATA
#
# Deliberately unrestricted. This rubric encodes what expert WPS practitioners
# consider good conflict advice, and getting that standard in front of model
# developers — including inside training corpora — is a goal of publishing it,
# not a risk to be guarded against. No canary or no-train notice is attached.
#
# The trade-off is stated openly in RELIABILITY.md: a public instrument that
# models may have trained on cannot indefinitely serve as a clean measuring
# device. Measurement integrity is handled by held-out and rotating scenario
# sets, not by restricting this file.
#
# Attribution under CC BY 4.0 is all that is asked.
# ============================================================================

tags:
  - women-peace-security
  - wps
  - gender
  - conflict
  - peace-and-security
  - policy-alignment
  - llm-evaluation
  - benchmark

# ============================================================================
# REPRODUCTION SETTINGS
#
# The settings below are what Our Secure Future actually ran to produce the
# published leaderboard scores. They are pinned here rather than left to
# harness defaults so that a third party re-running this blueprint reproduces
# those numbers rather than something close to them.
# ============================================================================

# Systems under test. Deliberately left unset so that this blueprint is
# bring-your-own-model: supply the systems you want to evaluate. Weval will
# otherwise fall back to its evolving "CORE" set, which will not match the
# published results.
#
# To evaluate specific systems, uncomment a `models:` block and list them in
# `provider:model` form:
#
#   models:
#     - openrouter:openai/gpt-4o
#     - openrouter:anthropic/claude-opus-5
#
# The published leaderboard scored these models bare, on these same scenarios
# and criteria:
#
#   openrouter:openai/gpt-4o
#   openrouter:openai/gpt-4o-mini
#   openrouter:openai/gpt-5.6-sol
#   openrouter:anthropic/claude-opus-5
#   openrouter:anthropic/claude-3-haiku
#   openrouter:google/gemini-2.5-flash
#   openrouter:google/gemini-3.1-pro-preview
#
# The leaderboard also includes Our Secure Future's own WPS Agent, which runs
# on commercial base models (GPT-4o and GPT-5.6 Sol) wrapped in a multi-agent
# scaffolding reached through a custom endpoint. The base models are public;
# the scaffolding is not, so those entries cannot be reproduced from this
# blueprint alone — the bare-model entries can.

# All published scores were generated at temperature 0. Weval's harness
# currently defaults to 0, but that is a default, not a guarantee — pin it.
temperature: 0

# The three-judge holistic consensus panel used for every published score.
# Weval's built-in default panel is different (qwen3-30b-a3b and
# gpt-oss-120b), so omitting this block would silently change the judges and
# therefore the scores.
evaluationConfig:
  llm-coverage:
    judges:
      - id: holistic-gemini-2-5-flash
        model: openrouter:google/gemini-2.5-flash
        approach: holistic
      - id: holistic-gpt-4-1-mini
        model: openrouter:openai/gpt-4.1-mini
        approach: holistic
      - id: holistic-claude-haiku-4-5
        model: openrouter:anthropic/claude-haiku-4.5
        approach: holistic

render_as: markdown
