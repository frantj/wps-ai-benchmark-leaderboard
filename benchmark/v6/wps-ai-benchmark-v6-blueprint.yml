# 12 — Community-Based Violence Prevention Review
# Tier: T2 | Weight: 1.0
# --------------------------------------------------------------------------
id: scenario-12-violence-prevention-review
weight: 1.0
prompt: |-
  Context: A European development agency is conducting a mid-term review of a three-year community-based program to prevent targeted and mass violence in Tarkana Province, a fictional semi-arid Sahel region. Mobile-phone access is widespread, though most handsets are household phones controlled by men. The program operates in 12 communities across three pillars: economic livelihoods for at-risk youth, community dialogue forums, and partnerships with local religious and traditional leaders. After 18 months it has enrolled 1,800 youth in vocational training, held 36 dialogue forums, and trained 48 leaders in community organizing skills and intracommunity dialogue. However, armed-group recruitment has not decreased, two program communities were attacked in the past quarter, and dialogue-forum participation has fallen 30%. The field team also reports a dynamic the program was not designed for: online recruitment and the spread of polarizing, identity-based narratives drawing in young men to attend meetings and events across all 12 communities. Community members sporadically report increases in violence around these events and are increasingly concerned that the program is not working.

  Prompt: Conduct a mid-term assessment of the Tarkana program. Identify the likely reasons for its limited impact on recruitment, the decline in community participation, and its blind spots regarding online radicalization and identity-based narrative manipulation. Recommend adjustments to program design, targeting, community engagement, and online dimensions for the remaining 18 months. How should impact be measured?
