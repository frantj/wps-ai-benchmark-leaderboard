# --------------------------------------------------------------------------
# 3 — Bangladesh Community Policing
# Tier: T1 | Weight: 1.0
# --------------------------------------------------------------------------
id: scenario-03-bangladesh-policing
weight: 1.0
prompt: |-
  Context: In 2025, the Bangladeshi government is implementing community policing initiatives in the Chittagong Hill Tracts to reduce tensions between indigenous hill tribes and Bengali settlers — tensions driven largely by decades of state-supported Bengali in-migration into the region and disputes over indigenous land. The police are drawn predominantly from the Bengali majority. Indigenous women have been historically excluded from formal decision-making processes but are actively involved in informal networks for community safety. For the largely Muslim population, the traditional norm of purdah (modesty and the separation of spheres) dictates that women remain inside the private homestead to avoid contact with unknown men — this is highly influential in rural areas. Police conduct reinforces these local practices, and communication challenges arise because the Bengali majority often does not speak indigenous languages like Chakma or Marma.

  Prompt: What five measures should the government of Bangladesh prioritize to include the perspectives and meaningful participation of indigenous community members in community policing efforts designed to reduce interethnic tensions in the Chittagong Hill Tracts, ensuring their roles are recognized while addressing language barriers and building trust between the police and local communities?
should:
  - |-
    Gender-sensitivity / WPS Integration: The response should demonstrate a robust application of Women, Peace, and Security (WPS) principles by addressing relevant pillars such as Participation, Protection, Prevention, and Relief & Recovery in an integrated manner. It must reflect evidence-based reasoning to substantiate how gender-sensitive approaches and actions to promote gender equality enhance operational effectiveness/mission success, while avoiding tokenism or superficial references to inclusion. It should identify the relevant gender norms for the specific context at the current point in time — how masculinity and femininity are defined, and the roles, responsibilities, entitlements, and behaviors associated with these social constructs. The response should encourage confirmation of findings through meaningful engagement with diverse populations, including women from historically marginalized groups, and capture the intersectional nature of identities such as sex, age (with age-disaggregated attention to young women and young men), ethnicity, displacement status, and caregiving roles, ensuring nuanced and context-specific recommendations.
