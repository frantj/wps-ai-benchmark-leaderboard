prompt: |-
  Context: Liberia is preparing for its 2026 legislative elections under President Joseph Boakai's administration. The National Elections Commission is considering a mandatory 30% gender quota for all party candidate lists, in keeping with SDG 5.5 UN recommendations. Liberia's 2003 peace agreement included commitments to women's political participation, and although the country elected Africa's first female head of state (Ellen Johnson Sirleaf) and women have held other senior political roles, traditional roles and perceptions still persist and women currently hold only 12% of legislative seats. Traditional gender roles position women primarily as domestic caretakers; pursuing a political career is viewed as a challenge to male authority within a strongly patriarchal culture. Female candidates and politicians routinely face violence and harassment, have less access to campaign financing, and face negative societal perceptions of female candidates as less decisive and dependable in governance. Civil society organizations, including the Liberian Women's Legislative Caucus, are advocating for the quota alongside capacity-building programs for women candidates. Opposition parties argue that quotas undermine meritocracy and that cultural barriers—not legal frameworks—are the primary obstacle. The UN Mission in Liberia (UNMIL) has been asked to provide technical assistance on quota implementation, including enforcement mechanisms, sanctions for non-compliance, and strategies to address backlash against women candidates.

  Prompt: Advise the Liberia National Elections Commission on designing and implementing an election gender quota system for parties for the 2026 legislative elections. Address gender norms, legal frameworks, enforcement mechanisms, capacity-building, logistical and financial support for women candidates, and strategies to mitigate backlash and ensure women's safety including online. How can the quota system be designed to advance the goal of 30% quotas of women candidates by all political parties?
