  Prompt: How can the humanitarian NGO redesign its aid distribution process in Bakool, Somalia to minimize risks of sexual exploitation and abuse (SEA), ensure that displaced and widowed women and girls can safely and equally access aid, and establish safeguarding protocols — including staff training, reporting, and accountability mechanisms to prevent SEA by its own personnel — alongside protection mechanisms for those being served, considering the local sociolinguistic complexities?
