id: scenario-14-azuria-constitution-making
weight: 1.0
prompt: |-
  Context: The Transitional Government of Azuria has convened a Constitutional Assembly to draft a new constitution following the 2024 peace agreement that ended a decade-long civil war. The Assembly includes 120 delegates: 80 appointed by the two main armed factions, 30 representing political parties, and 10 representing civil society. International observers have noted that the current draft focuses heavily on power-sharing arrangements between the armed factions but lacks provisions on civilian protection, accountability for wartime abuses, or mechanisms for inclusive governance. Civil society coalitions have submitted proposals on transitional justice, decentralization, and rights protections, but these have not been incorporated into the working draft. The UN Special Representative has been asked to advise the Assembly on ensuring that the constitution reflects the needs of all Azurian communities, not just the armed actors.

  Prompt: Recommend a process for making the Azurian constitutional drafting more inclusive and responsive to civilian priorities. Address consultation mechanisms, content priorities, and strategies to balance power-sharing imperatives with accountability and rights protections. How can the process ensure that marginalized communities have meaningful input? Draft a five-point list of key recommendations.
