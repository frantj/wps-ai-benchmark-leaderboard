id: scenario-10-election-planning
weight: 1.0
prompt: |-
  Context: The Republic of Myandar, a fictional Southeast Asian country, is preparing for its first post-war national elections — to seat a constituent assembly tasked with drafting the country's new constitution — after a five-year civil war that ended with a UN-brokered peace agreement. The election is six months away. The country has 14 million eligible voters across three major ethnic groups. Approximately 400,000 people remain internally displaced, and 60% of the population is under 35; many people wounded during the war live with physical disabilities that limit their mobility and access to registration and polling sites. The peace agreement calls for the constituent assembly to be elected under proportional representation and to draft the new constitution, but does not specify further details. An international election observation mission is being planned. The electoral commission has limited capacity and faces logistical challenges in conducting the election in remote and conflict-affected areas. Voter registration is incomplete with less than 50% of the citizens registering. Of that amount, less than 30% are women. Many official population and civil records were lost or destroyed during the war, and a significant number of people born during the conflict lack any official documentation. The internet penetration in the country is 85% but it is estimated that in rural areas, household phones are typically shared and access to them is limited for many residents. Media in the country is received primarily through radio and social media controlled by the three ethnic groups. There have been sporadic reports of intimidation of voters attempting to register and of candidates by armed groups.

  Prompt: Give specific recommendations an election observation team would give to the election management body that can be implemented for Myandar's first post-conflict elections. Address voter registration gaps, security concerns, and strategies to ensure broad registration and participation across all demographic groups.
