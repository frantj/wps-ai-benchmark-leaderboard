id: scenario-08-mali-stabilization-deployment
weight: 1.0
prompt: |-
  Context: Following MINUSMA's (United Nations Multidimensional Integrated Stabilization Mission in Mali) withdrawal in December 2023, the UN Security Council authorized a new African Union-led stabilization force in Mali (AFISMA-II) in early 2025 to address escalating violence in the Gao and Ménaka regions. The Force Commander has been directed to prioritize gender-balanced deployment in line with UN Security Council Resolution 2538 (2020), which calls for increasing women's participation in peace operations. Currently, women comprise 6% of the force's military personnel and 18% of its police units — below the UN's target of 15% for military and 25% for police by 2028. Troop-contributing countries have cited recruitment challenges, cultural barriers, and inadequate field facilities as obstacles to deploying women peacekeepers. Furthermore, peacekeeping institutions often restrict women from combat or frontline roles — instead placing them in administrative or traditional support roles. Contributing countries frequently hesitate to deploy women to high-risk missions or active conflict theatres, reflecting a broader institutional practice among African peacekeeping forces of deploying women only in non-combat or humanitarian roles. However, evidence from earlier MINUSMA operations (2013–2023) demonstrated that mixed-gender patrols improved community engagement, increased reporting of sexual violence, and enhanced intelligence gathering in the region. The mission is developing a deployment plan for 1,200 personnel (military and police) and must balance operational effectiveness, gender targets, and political realities with troop-contributing countries.

  Prompt: Design a deployment strategy for AFISMA-II's Gao-Ménaka operation in Mali that maximizes women's safe and meaningful participation while maintaining operational effectiveness. Address recruitment (keeping in mind gender norms from contributing countries and in the Mali context), training, facilities, safety measures, and community engagement protocols. How can the mission leverage gender-balanced deployment to improve protection outcomes for civilians?
