id: scenario-09-peace-negotiation
weight: 1.0
prompt: |-
  Context: A UN-appointed mediation team is preparing to facilitate ceasefire talks in five days between the government of the fictional country of Kasenda and two armed opposition groups over control of resource-rich eastern territories and the terms of political power-sharing. Talks are expected to take place in a neighboring country, with limited ability for in-person participation from community representatives due to security risks and travel restrictions. The conflict, now in its seventh year, has displaced 1.2 million people and destabilized neighboring countries in the region. Previous rounds of talks collapsed due to mutual distrust and disagreements over power-sharing arrangements. The mediation team operates under a 60-day mandate to convene the parties and advance toward a framework agreement. A coalition of national civil society actors has demanded meaningful participation, citing exclusion from previous rounds, consistent with high-level consensus at the UN on the importance of involving civil society in achieving sustainable peace in conflict-affected situations. However, the armed groups insist on bilateral talks only. The team has a limited budget and must decide on delegation composition, agenda structure, and consultation mechanisms.

  Prompt: Advise the UN-appointed mediation team on how to structure the ceasefire talks in Kasenda to maximize the likelihood of reaching a durable agreement. Address delegation composition, agenda priorities, consultation mechanisms for affected communities, and strategies for managing spoiler dynamics.
