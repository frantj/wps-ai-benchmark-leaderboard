name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Purge Cloudflare cache
        # Cloudflare proxies this site, so a deploy alone does not refresh the
        # edge. Without this, changed files can serve stale to some visitors.
        # Skipped automatically if the secrets are not set.
        if: success() && env.CF_ZONE != '' && env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response" | python3 -c "
          import json,sys
          r = json.load(sys.stdin)
          if r.get('success'):
              print('Cloudflare cache purged.')
          else:
              print('Purge FAILED:', json.dumps(r.get('errors'), indent=2))
              sys.exit(1)
          "
